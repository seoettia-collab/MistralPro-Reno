name: Deploy to OVH
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate SEO and generate canonical sitemap
        run: |
          python3 scripts/check-seo.py --write
          node --test tests/*.test.js
          python3 -B tests/indexnow_test.py
      
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.ftp-deploy-sync-state.json

      - name: Notify IndexNow after verified deployment
        continue-on-error: true
        run: python3 scripts/notify-indexnow.py

