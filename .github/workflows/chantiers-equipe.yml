name: Chantiers equipe (generation)
on:
  push:
    branches: [chantiers-equipe]
    paths: ['.github/workflows/chantiers-equipe.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generer et verifier
        run: |
          set -e
          pip install -q pillow==12.3.0
          test "$(git hash-object scripts/chantiers-ajout.py)" = f3be9512bd948e4a7460493eabde29ce2eea9e28
          for f in chantiers-src/*; do n="$(echo "$f" | tr ' ' '_')"; [ "$f" = "$n" ] || mv "$f" "$n"; done
          ls chantiers-src
          python3 scripts/chantiers-ajout.py
          git rm -rq --cached chantiers-src
          rm -r chantiers-src
          python3 scripts/check-seo.py
          git add -A
          git diff --cached --name-status origin/main -- . ':!.github'
          n=$(git diff --cached --name-only origin/main -- . ':!.github' | wc -l)
          [ "$n" = 8 ]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "CHANTIERS-REELS : photos de l équipe sur les chantiers"
          git push
