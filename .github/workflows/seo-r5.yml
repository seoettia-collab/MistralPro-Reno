name: SEO correctif (generation)
on:
  push:
    branches: [seo-renforcement-correctif]
    paths: ['.github/workflows/seo-r5.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generer et verifier
        run: |
          set -e
          cp seo-r5/manifest.txt /tmp/manifest.txt
          python3 scripts/seo-renforcement-correctif.py
          git checkout 20d18c04c8beab65b1d1af31b36996f29221d952 -- cost_calculator.html sitemap.xml
          python3 scripts/check-seo.py --write
          git rm -rq seo-r5
          ok=1
          while read h f; do a=$(git hash-object "$f"); if [ "$a" != "$h" ]; then echo "DIFFERENT: $f"; ok=0; fi; done < /tmp/manifest.txt
          git add -A
          n=$(git diff --cached --name-only origin/main -- . ':!.github' | wc -l)
          git diff --cached --name-only origin/main -- . ':!.github'
          [ "$ok" = 1 ] && [ "$n" = 6 ]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "SEO-RENFORCEMENT : liens vers le simulateur actuel, titre du simulateur"
          git push
