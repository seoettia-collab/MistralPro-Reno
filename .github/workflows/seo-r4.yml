name: SEO renforcement 4 pages (generation)
on:
  push:
    branches: [seo-renforcement-4-pages]
    paths: ['.github/workflows/seo-r4.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generer et verifier
        run: |
          set -e
          cp seo-r4/manifest.txt /tmp/manifest.txt
          python3 scripts/seo-renforcement-4-pages.py
          git rm -rq seo-r4
          ok=1
          while read h f; do a=$(git hash-object "$f"); if [ "$a" != "$h" ]; then echo "DIFFERENT: $f"; ok=0; fi; done < /tmp/manifest.txt
          git add -A
          n=$(git diff --cached --name-only origin/main -- . ':!.github' | wc -l)
          git diff --cached --name-only origin/main -- . ':!.github'
          [ "$ok" = 1 ] && [ "$n" = 6 ]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "SEO-RENFORCEMENT : titres, textes et liens internes de 4 pages"
          git push
